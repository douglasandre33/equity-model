[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-model"
version = "0.1.0"
description = "Dynamic equity research model with fundamentals-driven intrinsic value estimates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenAI", email = "devnull@example.com"}]
keywords = ["finance", "valuation", "dcf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "fastapi>=0.110.0",
  "jinja2>=3.1.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
equity-model = "equity_model.cli:main"
equity-model-web = "equity_model.web:main"

[tool.setuptools.package-data]
"equity_model" = ["py.typed", "templates/*.html", "static/*.css"]

[tool.setuptools.packages.find]
where = ["src"]
